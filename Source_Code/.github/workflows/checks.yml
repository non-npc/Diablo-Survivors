name: Foundation checks
on: [push, pull_request]
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/setup_godot.py
      - run: python scripts/check.py
      - run: python scripts/package_release.py
